<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Timer SystemVerilog verification architecture</title>
  <desc id="desc">Directed and random tests share a typed request mailbox and one APB driver. Passive APB and Timer-event monitors clone observations to predictor and coverage paths. Typed check results feed a comparator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8faf9}.frame{fill:#fff;stroke:#d4ddd7;stroke-width:2}.box{fill:#fff;stroke:#1f2937;stroke-width:2}.active{fill:#ecfdf3;stroke:#15803d;stroke-width:2}.passive{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.check{fill:#fffbeb;stroke:#b45309;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#17211b}.subtitle{font:15px Arial,sans-serif;fill:#526057}.zone{font:700 14px Arial,sans-serif;fill:#15803d;letter-spacing:1px}.name{font:700 17px Arial,sans-serif;fill:#17211b;text-anchor:middle}.text{font:13px Arial,sans-serif;fill:#526057;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#64748b;text-anchor:middle}.label{font:12px Arial,sans-serif;fill:#15803d;text-anchor:middle}.flow{fill:none;stroke:#15803d;stroke-width:2.4;marker-end:url(#arrow)}.observe{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrowBlue)}.dash{stroke-dasharray:7 5}
    </style>
  </defs>

  <rect class="bg" width="1400" height="788"/>
  <rect class="frame" x="24" y="24" width="1352" height="740" rx="22"/>
  <text class="title" x="700" y="63" text-anchor="middle">Class-based SystemVerilog Verification Environment</text>
  <text class="subtitle" x="700" y="89" text-anchor="middle">One active signal owner · independent passive streams · prediction separated from verdict policy</text>

  <text class="zone" x="58" y="130">STIMULUS AND ACTIVE DRIVE</text>
  <rect class="active" x="60" y="155" width="190" height="100" rx="14"/>
  <text class="name" x="155" y="188">Directed Test</text>
  <text class="text" x="155" y="214">named corner cases</text>
  <text class="small" x="155" y="236">extends timer_base_test</text>

  <rect class="active" x="60" y="285" width="190" height="100" rx="14"/>
  <text class="name" x="155" y="318">Random Test</text>
  <text class="text" x="155" y="344">base + inline constraints</text>
  <text class="small" x="155" y="366">extends timer_base_test</text>

  <rect class="active" x="330" y="220" width="210" height="105" rx="14"/>
  <text class="name" x="435" y="254">Request Mailbox</text>
  <text class="text" x="435" y="280">mailbox #(apb_transaction)</text>
  <text class="small" x="435" y="303">ordered request queue</text>

  <rect class="active" x="620" y="220" width="180" height="105" rx="14"/>
  <text class="name" x="710" y="254">APB Driver</text>
  <text class="text" x="710" y="280">SETUP / ACCESS</text>
  <text class="small" x="710" y="303">only request-signal owner</text>

  <rect class="active" x="880" y="220" width="180" height="105" rx="14"/>
  <text class="name" x="970" y="254">timer_if</text>
  <text class="text" x="970" y="280">driver_cb / monitor_cb</text>
  <text class="small" x="970" y="303">explicit timing views</text>

  <rect class="box" x="1140" y="205" width="190" height="135" rx="14"/>
  <text class="name" x="1235" y="244">Timer DUT</text>
  <text class="text" x="1235" y="274">APB registers</text>
  <text class="text" x="1235" y="297">counter + status</text>
  <text class="small" x="1235" y="321">Verilog RTL</text>

  <path class="flow" d="M250 205 H285 V255 H330"/>
  <path class="flow" d="M250 335 H285 V290 H330"/>
  <path class="flow" d="M540 273 H620"/>
  <path class="flow" d="M800 273 H880"/>
  <path class="flow" d="M1060 273 H1140"/>
  <text class="label" x="580" y="258">get(request)</text>

  <text class="zone" x="58" y="445">PASSIVE OBSERVATION, CHECKING AND COVERAGE</text>
  <rect class="passive" x="60" y="480" width="190" height="105" rx="14"/>
  <text class="name" x="155" y="514">APB Monitor</text>
  <text class="text" x="155" y="540">completed transfers</text>
  <text class="small" x="155" y="563">clones each observation</text>

  <rect class="passive" x="60" y="620" width="190" height="105" rx="14"/>
  <text class="name" x="155" y="654">Timer-event Monitor</text>
  <text class="text" x="155" y="680">reset / clock / wrap causes</text>
  <text class="small" x="155" y="703">clones each event</text>

  <rect class="check" x="360" y="520" width="210" height="125" rx="14"/>
  <text class="name" x="465" y="554">Predictor</text>
  <text class="text" x="465" y="580">expected TDR/TCR/TSR/TCNT</text>
  <text class="text" x="465" y="604">emits typed check results</text>
  <text class="small" x="465" y="626">no PASS/FAIL policy</text>

  <rect class="check" x="660" y="520" width="190" height="125" rx="14"/>
  <text class="name" x="755" y="554">Comparator</text>
  <text class="text" x="755" y="580">actual vs expected</text>
  <text class="text" x="755" y="604">PASS / FAIL / report</text>
  <text class="small" x="755" y="626">no state prediction</text>

  <rect class="passive" x="960" y="520" width="230" height="125" rx="14"/>
  <text class="name" x="1075" y="554">Coverage Collector</text>
  <text class="text" x="1075" y="580">APB + Timer-event bins</text>
  <text class="text" x="1075" y="604">requirement-driven crosses</text>
  <text class="small" x="1075" y="626">occurrence, not correctness</text>

  <path class="observe" d="M1235 340 V425 H155 V480"/>
  <text class="label" x="695" y="415">physical APB activity through monitor_cb</text>
  <path class="observe" d="M1190 340 V455 H280 V673 H250"/>
  <text class="label" x="755" y="447">sampled Timer causes</text>
  <path class="observe" d="M250 532 H360"/>
  <path class="observe" d="M250 673 H315 V610 H360"/>
  <path class="flow" d="M570 582 H660"/>
  <text class="label" x="615" y="567">check_result</text>
  <path class="observe dash" d="M250 515 H915 V560 H960"/>
  <path class="observe dash" d="M250 690 H915 V605 H960"/>

  <rect class="frame" x="310" y="684" width="880" height="48" rx="12"/>
  <text class="text" x="750" y="706">Lifecycle invariant</text>
  <text class="small" x="750" y="724">sent = driven = APB observed = APB covered · Timer emitted = Timer predicted = Timer covered · results emitted = compared</text>
</svg>
