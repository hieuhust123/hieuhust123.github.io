<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc">
<title id="title">01 / RTL: configuration to counter</title><desc id="desc">Functional views of timer_top • signal tags replace long feedback wires</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#47645b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183b30} .title{font-size:25px;font-weight:700} .body{font-size:16px;fill:#465e55} .name{font-size:19px;font-weight:700} .label{font-size:15px;fill:#47645b} .section{font-size:16px;font-weight:700;fill:#247450}</style>
<rect width="760" height="1030" rx="16" fill="#fafcfb"/>
<text x="32" y="45" class="title" text-anchor="start">01 / RTL: configuration to counter</text>
<text x="32" y="74" class="body" text-anchor="start">Functional views of timer_top • signal tags replace long feedback wires</text>
<text x="32" y="116" class="section" text-anchor="start">CONFIGURATION  /  APB access and register storage</text>
<rect x="32" y="138" width="310" height="94" rx="10" fill="#eef5fc" stroke="#99b6cf" stroke-width="1.5"/>
<text x="50" y="167" class="name" text-anchor="start">APB interface</text>
<text x="50" y="193" class="body" text-anchor="start">Request → rw_control</text>
<text x="50" y="216" class="body" text-anchor="start">← PRDATA, PREADY, PSLVERR</text>
<path d="M342 185 H410" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="138" width="318" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="428" y="167" class="name" text-anchor="start">rw_control</text>
<text x="428" y="193" class="body" text-anchor="start">APB state machine + wait states</text>
<text x="428" y="216" class="body" text-anchor="start">Stores TDR, TCR and TSR</text>
<path d="M568 232 V294" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="582" y="269" class="label" text-anchor="start">TDR / TCR</text>
<rect x="410" y="294" width="318" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="428" y="323" class="name" text-anchor="start">control_logic</text>
<text x="428" y="349" class="body" text-anchor="start">Load value, load, enable, direction</text>
<text x="428" y="372" class="body" text-anchor="start">Clock select: cks = TCR[1:0]</text>
<rect x="32" y="294" width="310" height="94" rx="10" fill="#fff8e9" stroke="#cfb778" stroke-width="1.5"/>
<text x="50" y="323" class="name" text-anchor="start">Readback / status inputs</text>
<text x="50" y="349" class="body" text-anchor="start">[R] TCNT → APB read mux</text>
<text x="50" y="372" class="body" text-anchor="start">[S] Wrap flags → TSR hardware set</text>
<text x="32" y="432" class="section" text-anchor="start">DATAPATH  /  all state updates use PCLK</text>
<rect x="32" y="454" width="310" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="50" y="483" class="name" text-anchor="start">clock_select</text>
<text x="50" y="509" class="body" text-anchor="start">CLK_IN[3:0] + cks</text>
<text x="50" y="532" class="body" text-anchor="start">Select one external timer clock</text>
<path d="M342 501 H410" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="485" class="label" text-anchor="start">clock</text>
<rect x="410" y="454" width="318" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="428" y="483" class="name" text-anchor="start">counter_unit</text>
<text x="428" y="509" class="body" text-anchor="start">Detect selected-clock rising edge</text>
<text x="428" y="532" class="body" text-anchor="start">Update when edge AND enable</text>
<path d="M568 548 V615" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="582" y="584" class="label" text-anchor="start">load / ±1 / hold</text>
<rect x="410" y="615" width="318" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="428" y="644" class="name" text-anchor="start">TCNT [7:0]</text>
<text x="428" y="670" class="body" text-anchor="start">Counter state in counter_unit</text>
<text x="428" y="693" class="body" text-anchor="start">[R] Live value returns to read mux</text>
<path d="M568 709 V777" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="582" y="746" class="label" text-anchor="start">TCNT</text>
<rect x="410" y="777" width="318" height="94" rx="10" fill="#fff8e9" stroke="#cfb778" stroke-width="1.5"/>
<text x="428" y="806" class="name" text-anchor="start">comparator (RTL)</text>
<text x="428" y="832" class="body" text-anchor="start">Uses TCNT history, load, direction</text>
<text x="428" y="855" class="body" text-anchor="start">[S] TMR_OVF / TMR_UDF outputs</text>
<rect x="32" y="615" width="310" height="94" rx="10" fill="#ffffff" stroke="#cbd8d1" stroke-width="1.5"/>
<text x="50" y="644" class="name" text-anchor="start">Control inputs</text>
<text x="50" y="670" class="body" text-anchor="start">From control_logic above:</text>
<text x="50" y="693" class="body" text-anchor="start">TDR, load, enable, direction</text>
<rect x="32" y="777" width="310" height="94" rx="10" fill="#ffffff" stroke="#cbd8d1" stroke-width="1.5"/>
<text x="50" y="806" class="name" text-anchor="start">Status return [S]</text>
<text x="50" y="832" class="body" text-anchor="start">Flags pass through control_logic</text>
<text x="50" y="855" class="body" text-anchor="start">to rw_control; set overrides W1C</text>
<text x="32" y="913" class="section" text-anchor="start">REGISTER MAP</text>
<text x="32" y="941" class="body" text-anchor="start">0x0  TDR · R/W       0x1  TCR · R/W, reserved bits read as zero</text>
<text x="32" y="968" class="body" text-anchor="start">0x2  TSR · sticky W1C       0x3  TCNT · read-only</text>
<text x="32" y="995" class="body" text-anchor="start">0x4–0x7 · PSLVERR     |     [R] and [S] identify matching signal endpoints.</text></svg>