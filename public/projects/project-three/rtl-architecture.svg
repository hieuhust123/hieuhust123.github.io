<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">APB Timer IP RTL architecture</title>
  <desc id="desc">External APB and four Timer clock inputs feed an APB controller, register bank, clock selector, PCLK-domain edge qualifier, counter, and real-wrap detector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <style>
      .bg{fill:#f8faf9}.frame{fill:#fff;stroke:#d4ddd7;stroke-width:2}.box{fill:#fff;stroke:#1f2937;stroke-width:2}.green{fill:#ecfdf3;stroke:#15803d;stroke-width:2}.amber{fill:#fffbeb;stroke:#b45309;stroke-width:2}.blue{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#17211b}.subtitle{font:15px Arial,sans-serif;fill:#526057}.name{font:700 18px Arial,sans-serif;fill:#17211b;text-anchor:middle}.text{font:14px Arial,sans-serif;fill:#526057;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#64748b;text-anchor:middle}.label{font:13px Arial,sans-serif;fill:#15803d;text-anchor:middle}.flow{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#b45309;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="788"/>
  <rect class="frame" x="24" y="24" width="1352" height="740" rx="22"/>
  <text class="title" x="700" y="66" text-anchor="middle">8-bit APB Timer IP — Verilog RTL</text>
  <text class="subtitle" x="700" y="92" text-anchor="middle">Four external Timer clocks are selected, edge-qualified, and consumed as enables in the PCLK domain</text>

  <rect class="blue" x="60" y="145" width="240" height="190" rx="14"/>
  <text class="name" x="180" y="178">AMBA APB</text>
  <text class="text" x="180" y="208">PCLK, PRESETn</text>
  <text class="text" x="180" y="232">PSEL, PENABLE, PWRITE</text>
  <text class="text" x="180" y="256">PADDR[2:0], PWDATA[7:0]</text>
  <text class="text" x="180" y="286">PRDATA[7:0], PREADY</text>
  <text class="text" x="180" y="310">PSLVERR</text>

  <rect class="green" x="380" y="135" width="285" height="210" rx="14"/>
  <text class="name" x="522" y="172">APB Read/Write Control</text>
  <text class="text" x="522" y="204">IDLE → SETUP → ACCESS</text>
  <text class="text" x="522" y="229">configurable wait states</text>
  <text class="text" x="522" y="254">reserved-address PSLVERR</text>
  <text class="text" x="522" y="279">read mux + write enables</text>
  <text class="small" x="522" y="316">rw_control.v</text>

  <rect class="amber" x="760" y="125" width="300" height="230" rx="14"/>
  <text class="name" x="910" y="160">Four-address register map</text>
  <text class="text" x="910" y="192">0x0  TDR — load data, R/W</text>
  <text class="text" x="910" y="220">0x1  TCR — Timer control, R/W</text>
  <text class="text" x="910" y="248">0x2  TSR — sticky W1C status</text>
  <text class="text" x="910" y="276">0x3  TCNT — live read-only count</text>
  <text class="text" x="910" y="312">0x4–0x7 — reserved/error</text>
  <text class="small" x="910" y="338">TDR / TCR / TSR stored in rw_control</text>

  <path class="flow" d="M300 240 H380"/>
  <text class="label" x="340" y="226">request / response</text>
  <path class="flow" d="M665 240 H760"/>
  <text class="label" x="713" y="226">decode / data</text>

  <rect class="blue" x="60" y="470" width="240" height="130" rx="14"/>
  <text class="name" x="180" y="506">External Timer clocks</text>
  <text class="text" x="180" y="540">CLK_IN[3:0]</text>
  <text class="small" x="180" y="570">selected by TCR[1:0]</text>

  <rect class="green" x="380" y="455" width="230" height="160" rx="14"/>
  <text class="name" x="495" y="493">Clock Select</text>
  <text class="text" x="495" y="526">4-to-1 selector</text>
  <text class="text" x="495" y="551">TMR_CLK_IN</text>
  <text class="small" x="495" y="588">clock_select.v</text>

  <rect class="green" x="690" y="455" width="230" height="160" rx="14"/>
  <text class="name" x="805" y="493">PCLK Edge Qualifier</text>
  <text class="text" x="805" y="526">0 → 1 detection</text>
  <text class="text" x="805" y="551">TMR_EDGE enable</text>
  <text class="small" x="805" y="588">counter_unit.v</text>

  <rect class="green" x="1000" y="440" width="230" height="190" rx="14"/>
  <text class="name" x="1115" y="478">TCNT Datapath</text>
  <text class="text" x="1115" y="511">load / hold / ±1</text>
  <text class="text" x="1115" y="537">8-bit counter</text>
  <text class="text" x="1115" y="563">clocked only by PCLK</text>
  <text class="small" x="1115" y="605">counter_unit.v</text>

  <path class="flow" d="M300 535 H380"/>
  <path class="flow" d="M610 535 H690"/>
  <path class="flow" d="M920 535 H1000"/>
  <text class="label" x="960" y="520">enable</text>

  <path class="flow" d="M840 355 V400 H495 V455"/>
  <text class="label" x="632" y="390">TCR clock select</text>
  <path class="flow" d="M930 355 V410 H1115 V440"/>
  <text class="label" x="1058" y="398">TDR + TCR controls</text>

  <rect class="amber" x="1010" y="665" width="330" height="70" rx="14"/>
  <text class="name" x="1175" y="695">Real-wrap detector</text>
  <text class="text" x="1175" y="720">FF→00 OVF · 00→FF UDF · loads excluded</text>
  <path class="feedback" d="M1150 630 V665"/>
  <path class="feedback" d="M1010 700 H910 V355"/>
  <text class="label" x="954" y="686">hardware set → TSR</text>

  <text class="small" x="700" y="748">Six modules: timer_top · rw_control · control_logic · clock_select · counter_unit · comparator</text>
</svg>
