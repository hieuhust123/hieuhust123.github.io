<title id="title">02 / SV: stimulus and DUT connection</title><desc id="desc">tb_top_sv constructs the components and selects one test</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#47645b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183b30} .title{font-size:25px;font-weight:700} .body{font-size:16px;fill:#465e55} .name{font-size:19px;font-weight:700} .label{font-size:15px;fill:#47645b} .section{font-size:16px;font-weight:700;fill:#247450}</style>
<rect width="760" height="994" rx="16" fill="#fafcfb"/>
<text x="32" y="45" class="title" text-anchor="start">02 / SV: stimulus and DUT connection</text>
<text x="32" y="74" class="body" text-anchor="start">tb_top_sv constructs the components and selects one test</text>
<rect x="140" y="112" width="480" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="158" y="141" class="name" text-anchor="start">selected_test : timer_base_test</text>
<text x="158" y="167" class="body" text-anchor="start">+TEST=directed → tdr_directed_test</text>
<text x="158" y="190" class="body" text-anchor="start">+TEST=random → timer_random_test</text>
<path d="M380 206 V271" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="398" y="244" class="label" text-anchor="start">send(txn)</text>
<rect x="140" y="271" width="480" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="158" y="300" class="name" text-anchor="start">request_mbx</text>
<text x="158" y="326" class="body" text-anchor="start">mailbox #(apb_transaction) • queued requests</text>
<path d="M380 365 V430" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="398" y="403" class="label" text-anchor="start">get(txn)</text>
<rect x="140" y="430" width="480" height="94" rx="10" fill="#eef8f1" stroke="#8abb9a" stroke-width="1.5"/>
<text x="158" y="459" class="name" text-anchor="start">apb_driver</text>
<text x="158" y="485" class="body" text-anchor="start">SETUP → ACCESS → wait for PREADY → IDLE</text>
<text x="158" y="508" class="body" text-anchor="start">Sole owner of APB request signals</text>
<path d="M330 524 V590" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="561" class="label" text-anchor="start">drive requests</text>
<path d="M430 590 V524" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="448" y="561" class="label" text-anchor="start">sample response</text>
<rect x="140" y="590" width="480" height="94" rx="10" fill="#eef5fc" stroke="#99b6cf" stroke-width="1.5"/>
<text x="158" y="619" class="name" text-anchor="start">timer_if</text>
<text x="158" y="645" class="body" text-anchor="start">driver_cb: negedge PCLK</text>
<text x="158" y="668" class="body" text-anchor="start">Shared signals also feed both passive monitors</text>
<path d="M330 684 V750" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="722" class="label" text-anchor="start">APB requests</text>
<path d="M430 750 V684" fill="none" stroke="#47645b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="448" y="722" class="label" text-anchor="start">APB response</text>
<rect x="140" y="750" width="480" height="94" rx="10" fill="#ffffff" stroke="#cbd8d1" stroke-width="1.5"/>
<text x="158" y="779" class="name" text-anchor="start">timer_top DUT</text>
<text x="158" y="805" class="body" text-anchor="start">Verilog RTL • WAIT_STATE = 2</text>
<text x="158" y="828" class="body" text-anchor="start">PCLK and CLK_IN[3:0] generated by tb_top_sv</text>
<text x="32" y="892" class="section" text-anchor="start">CONTROL DETAILS</text>
<text x="32" y="922" class="body" text-anchor="start">Test calls driver.reset(); driver drives PRESETn.</text>
<text x="32" y="947" class="body" text-anchor="start">Driver triggers txn.driver_done; send() waits for that completion event.</text>
<text x="32" y="972" class="body" text-anchor="start">Passive checking and coverage are shown separately in diagram 03.</text></svg>